<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión Logística - BL</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f8; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 25px; }
    
    /* Grid de Métricas (KPIs) */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .kpi-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; border-left: 5px solid #0066cc; }
    .kpi-card h3 { margin: 0; font-size: 13px; color: #666; text-transform: uppercase; }
    .kpi-card .number { font-size: 24px; font-weight: bold; color: #333; margin-top: 5px; }

    label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; color: #333; }
    input, select, button { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background-color: #0066cc; color: white; font-weight: bold; cursor: pointer; border: none; margin-top: 20px; }
    button:hover { background-color: #0052a3; }
    #statusMessage { margin-top: 15px; font-weight: bold; text-align: center; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
    th { background-color: #f2f2f2; color: #333; font-weight: bold; }
    tr:nth-child(even) { background-color: #fafafa; }
    
    .btn-action { padding: 5px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 5px; font-weight: bold; color: white; }
    .btn-pdf { background-color: #28a745; }
    .btn-delete { background-color: #dc3545; }
    .select-estado-tabla { padding: 4px; font-size: 12px; margin: 0; width: auto; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- MÓDULO 1: TARJETAS KPI (ESTADÍSTICAS) -->
    <div class="kpi-grid">
      <div class="kpi-card" style="border-color: #0066cc;">
        <h3>Total Envíos</h3>
        <div class="number" id="kpiTotal">0</div>
      </div>
      <div class="kpi-card" style="border-color: #ffc107;">
        <h3>En Tránsito</h3>
        <div class="number" id="kpiTransito">0</div>
      </div>
      <div class="kpi-card" style="border-color: #17a2b8;">
        <h3>En Puerto</h3>
        <div class="number" id="kpiPuerto">0</div>
      </div>
      <div class="kpi-card" style="border-color: #28a745;">
        <h3>Liberados</h3>
        <div class="number" id="kpiLiberados">0</div>
      </div>
    </div>

    <!-- FORMULARIO DE EMISIÓN -->
    <div class="card">
      <h2>Emitir Nuevo Bill of Lading (BL)</h2>
      <form id="shippingForm">
        <label>Número de BL:</label>
        <input type="text" id="blNumber" placeholder="Ej: BL-VALPO-2026" required>
        
        <label>Shipper (Remitente):</label>
        <select id="shipperSelect" required>
          <option value="">Cargando shippers...</option>
        </select>

        <label>Consignee (Destinatario):</label>
        <select id="consigneeSelect" required>
          <option value="">Cargando consignees...</option>
        </select>
        
        <label>Estado del Envío:</label>
        <select id="estadoSelect" required>
          <option value="Emitido">Emitido</option>
          <option value="En Tránsito">En Tránsito</option>
          <option value="Ingresado a Puerto">Ingresado a Puerto</option>
          <option value="Liberado">Liberado</option>
        </select>
        
        <button type="submit">Guardar Envío en Airtable</button>
      </form>
      <p id="statusMessage"></p>
    </div>

    <!-- TABLA CON EDICIÓN DE ESTADO Y ELIMINACIÓN -->
    <div class="card">
      <h2>Bill of Ladings Emitidos</h2>
      
      <label for="buscarBL">Buscar BL o Empresa:</label>
      <input type="text" id="buscarBL" placeholder="Escribe para filtrar...">

      <table>
        <thead>
          <tr>
            <th>Número de BL</th>
            <th>Shipper</th>
            <th>Consignee</th>
            <th>Cambiar Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaRegistrosBody">
          <tr>
            <td colspan="5" style="text-align: center;">Cargando envíos...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
